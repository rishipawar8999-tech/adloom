# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "05491c913c36faff0a054d2082faf04f"
name = "Sales manager"
application_url = "https://adloom-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscription_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://adloom-production.up.railway.app/auth/callback",
  "https://adloom-production.up.railway.app/auth/shopify/callback",
  "https://adloom-production.up.railway.app/api/auth/callback"
]

[app_proxy]
url = "https://adloom-production.up.railway.app/app/proxy"
subpath = "timer"
prefix = "apps"
